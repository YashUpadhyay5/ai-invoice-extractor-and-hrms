services:
  # ================================================================
  # Hydro Fullstack Web Service (Express API + Embedded React UI)
  # ================================================================
  - type: web
    name: hydro-hrms-app
    env: node
    plan: starter # or free
    region: oregon # or frankfurt, singapore, ohio
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: node backend/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: hydro-hrms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: DB_POOL_MAX
        value: '10'
      - key: DB_POOL_MIN
        value: '2'

databases:
  # ================================================================
  # Hydro Managed PostgreSQL Database
  # ================================================================
  - name: hydro-hrms-db
    databaseName: hydro_hrms
    user: hydro_admin
    plan: starter # or free
    region: oregon
